[project]
name = "crx"
version = "0.1.0"
description = "Unified FBR corpus platform: QA portal + PDF→JSON pipelines"
# tools/acts/ uses PEP 701 f-strings (backslash escapes and reused quote characters
# inside expressions), which only parse on 3.12+. CI and the container both run 3.12.
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/backend/tests"]
pythonpath = ["apps/api"]

[tool.ruff]
target-version = "py312"
src = ["apps/api", "packages", "tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
