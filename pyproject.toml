[project]
name = "crx"
version = "0.1.0"
description = "Unified FBR corpus platform: QA portal + PDF→JSON pipelines"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/backend/tests"]
pythonpath = ["apps/api"]

[tool.ruff]
target-version = "py310"
src = ["apps/api", "packages", "tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
