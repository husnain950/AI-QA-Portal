services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/db/qa_portal.db
      UPLOAD_DIR: /app/data/uploads
      CORPUS_ORDINANCE: /data/corpus/ordinance
      CORPUS_ACTS: /data/corpus/acts
    volumes:
      - ./data/db:/app/data/db
      - ./data/uploads:/app/data/uploads
      - ./data/corpora/ordinance:/data/corpus/ordinance:ro
      - ./data/corpora/acts:/data/corpus/acts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
      VITE_STATIC_URL: ${VITE_STATIC_URL:-http://localhost:8000}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
