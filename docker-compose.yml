services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crx}
      POSTGRES_USER: ${POSTGRES_USER:-crx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-crx-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-crx-minio-development}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-crx-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-crx-minio-development}
      S3_BUCKET: ${S3_BUCKET:-crx-blobs}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://crx:crx@postgres:5432/crx}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      # Compose serves plain http on localhost, so a Secure session cookie would never
      # come back and the app would bounce to sign-in after every login.
      INSECURE_COOKIES: ${INSECURE_COOKIES:-1}
      # The first admin, created on a database with no users. Without these there is no
      # way to sign in to a fresh stack.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      UPLOAD_DIR: /app/data/uploads
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-crx-blobs}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-crx-minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-crx-minio-development}
      CORPUS_ORDINANCE: /data/corpus/ordinance
      CORPUS_ACTS: /data/corpus/acts
      SEED_CORPUS_ORDINANCE: /data/corpus/ordinance
      SEED_CORPUS_ACTS: /data/corpus/acts
    volumes:
      - blob-cache:/app/data/uploads
      - ./data/corpora/ordinance:/data/corpus/ordinance:ro
      - ./data/corpora/acts:/data/corpus/acts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "backend.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://crx:crx@postgres:5432/crx}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      UPLOAD_DIR: /app/data/uploads
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-crx-blobs}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-crx-minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-crx-minio-development}
      CORPUS_ORDINANCE: /data/corpus/ordinance
      CORPUS_ACTS: /data/corpus/acts
      SEED_CORPUS_ORDINANCE: /data/corpus/ordinance
      SEED_CORPUS_ACTS: /data/corpus/acts
    volumes:
      - blob-cache:/app/data/uploads
      - ./data/corpora/ordinance:/data/corpus/ordinance:ro
      - ./data/corpora/acts:/data/corpus/acts:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
      VITE_STATIC_URL: ${VITE_STATIC_URL:-http://localhost:8000}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  blob-cache:
