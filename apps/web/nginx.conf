server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 200m;

    # SPA fallback. Named location so encoded spaces/commas in leftover path
    # URLs (e.g. /timeline/foreign%20assets%20act%2C%202018/14) still get index.html.
    location / {
        try_files $uri @spa;
    }
    location @spa {
        rewrite ^ /index.html last;
    }

    location /api/ {
        proxy_pass http://${API_HOST}:${API_PORT}/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content-addressed blobs (pdf/<sha256>.pdf and friends) are immutable static
    # files. nginx serves them straight from the shared volume with sendfile,
    # native byte ranges and ETags — no API round-trip, so no session check, no
    # rate limiter, and PDFs keep streaming while the API deploys or is down.
    # The key-shape regex is the security boundary: the same volume also holds
    # .staging/, .cache/ and .preflight/ working directories that must never be
    # served, and they cannot match this pattern.
    # (Quoted: an unquoted {64} reads as a config block opener to nginx.)
    location ~ "^/uploads/(pdf|json|evidence|render)/[0-9a-f]{64}\.(pdf|json|zip|png)$" {
        root ${BLOB_ROOT};
        # Rollout-safe: when the blob volume is not attached to this container
        # (template not re-run yet) or a blob is genuinely absent, hand the
        # request to the API's /uploads route instead of 404ing. Merge and
        # volume-attach can happen in either order.
        try_files $uri @uploads_fallback;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @uploads_fallback {
        proxy_pass http://${API_HOST}:${API_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Anything else under /uploads/ — legacy flat names, dot-directories,
    # traversal — is a plain 404 that never touches disk or the API.
    location /uploads/ {
        return 404;
    }

    location /health {
        proxy_pass http://${API_HOST}:${API_PORT}/health;
        proxy_connect_timeout 5s;
    }
}
