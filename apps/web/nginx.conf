server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 200m;

    # SPA fallback. Named location so encoded spaces/commas in leftover path
    # URLs (e.g. /timeline/foreign%20assets%20act%2C%202018/14) still get index.html.
    location / {
        try_files $uri @spa;
    }
    location @spa {
        rewrite ^ /index.html last;
    }

    location /api/ {
        proxy_pass http://${API_HOST}:${API_PORT}/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://${API_HOST}:${API_PORT}/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://${API_HOST}:${API_PORT}/health;
        proxy_connect_timeout 5s;
    }
}
