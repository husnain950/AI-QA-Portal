name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crx
          POSTGRES_USER: crx
          POSTGRES_PASSWORD: crx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crx -d crx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt

      # The ingest pipelines under packages/ still carry a ruff backlog, so the
      # repo-wide run stays advisory. The API and tools are clean and gate merges.
      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check --output-format=github

      - name: Lint API and tools (blocking)
        run: ruff check --output-format=github apps/api tools

      - name: Pytest
        run: pytest apps/api/backend/tests tools/tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}/packages
          TEST_DATABASE_URL: postgresql+psycopg://crx:crx@127.0.0.1:5432/crx_test

  pipeline:
    name: Pipeline import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/requirements.txt

      - name: Install dependencies
        run: pip install -r packages/requirements.txt

      # The gate reads the corpus registry from apps/api (stdlib-only module), so
      # PYTHONPATH must include it even though this job installs no API deps.
      - name: Import smoke test
        run: python tools/run_tests_smoke.py
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}/packages

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  smoke:
    name: Review-page smoke
    runs-on: ubuntu-latest
    # Default is 6 hours. Without this, a stuck apt/Playwright download holds
    # the PR check — and the post-merge deploy — until a human cancels it.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crx
          POSTGRES_USER: crx
          POSTGRES_PASSWORD: crx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crx -d crx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://crx:crx@127.0.0.1:5432/crx
      STORAGE_BACKEND: filesystem
      UPLOAD_DIR: ${{ github.workspace }}/data/uploads
      PYTHONPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}/packages
      VITE_API_URL: http://127.0.0.1:8000/api
      VITE_STATIC_URL: http://127.0.0.1:8000
      # The API is on plain http here, so the session cookie cannot be Secure.
      INSECURE_COOKIES: '1'
      RATE_LIMITS: 'off'
      ADMIN_EMAIL: smoke@crx.test
      ADMIN_PASSWORD: smoke-run-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      # GitHub-hosted ubuntu-latest already has Chromium's shared libraries
      # (libasound, libatk, libgbm, …). `install --with-deps` then apt-installs
      # CJK/X11 font packages this smoke test does not need. Fetching those
      # from the Ubuntu archive has taken 30+ minutes (11 kB/s) and has hung
      # for hours on apt lock, blocking CI and the main deploy.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Playwright Chromium
        timeout-minutes: 3
        run: npx playwright install chromium
        working-directory: apps/web

      # No private corpus in CI, so generate a micro-corpus and load it through the
      # same acts sync the real corpus uses.
      - name: Seed the fixture corpus
        run: make seed-fixtures

      - name: Start the API
        run: |
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health/ready && exit 0
            sleep 1
          done
          echo "API did not become ready"; cat /tmp/api.log; exit 1

      - name: Start the web server
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 \
            > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 1
          done
          echo "Vite did not start"; cat /tmp/web.log; exit 1
        working-directory: apps/web

      - name: Review-page smoke
        run: npm run smoke
        working-directory: apps/web

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke
          path: |
            apps/web/scripts/visual_smoke_report.json
            apps/web/scripts/visual_shots/
          if-no-files-found: ignore
