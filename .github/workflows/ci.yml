name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt

      # The repo carries a large backlog of ruff findings in the ingest
      # pipelines, so lint is reported but does not gate merges yet.
      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check --output-format=github

      - name: Lint tooling (blocking)
        run: ruff check tools/northflank_deploy.py tools/tests

      - name: Pytest
        run: pytest apps/api/backend/tests tools/tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}/packages

  pipeline:
    name: Pipeline import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/requirements.txt

      - name: Install dependencies
        run: pip install -r packages/requirements.txt

      - name: Import smoke test
        run: python tools/run_tests_smoke.py
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}/packages

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
