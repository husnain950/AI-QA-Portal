name: Deploy to Northflank

# Runs after CI succeeds on main, so merging a PR builds and rolls out that
# exact commit. Can also be dispatched manually to redeploy any SHA.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to deploy (defaults to the branch head)
        required: false
        type: string
      services:
        description: Comma-separated Northflank service IDs
        required: false
        default: crx-api,crx-web
        type: string

concurrency:
  group: deploy-northflank
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # workflow_run fires for failed CI runs too; only ship green commits.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID || 'qa-pdf-portal' }}
      NORTHFLANK_SERVICES: ${{ inputs.services || 'crx-api,crx-web' }}
      NORTHFLANK_TEAM_ID: ${{ vars.NORTHFLANK_TEAM_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the Northflank token is configured
        run: |
          if [ -z "$NORTHFLANK_API_TOKEN" ]; then
            echo "::error::NORTHFLANK_API_TOKEN is not set. Add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Report current Northflank service state
        run: python tools/northflank_deploy.py check

      - name: Build and deploy
        run: python tools/northflank_deploy.py deploy --sha "$DEPLOY_SHA"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Northflank deploy"
            echo ""
            echo "- Project: \`$NORTHFLANK_PROJECT_ID\`"
            echo "- Services: \`$NORTHFLANK_SERVICES\`"
            echo "- Commit: \`$DEPLOY_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
